replicaCount: 3
image:
  repository: self-healing-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent
startupDelaySeconds: 10
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
pdb:
  minAvailable: 2
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 60
