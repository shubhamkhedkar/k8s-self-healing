apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-app
  namespace: self-healing
  labels:
    app: self-healing-app
spec:
  replicas: 3                      # the ReplicaSet keeps 3 pods running at all times
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: self-healing-app
  template:
    metadata:
      labels:
        app: self-healing-app
    spec:
      restartPolicy: Always        # crashed containers are restarted by the kubelet
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: self-healing-app
      containers:
        - name: app
          image: self-healing-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STARTUP_DELAY_SECONDS
              value: "10"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:            # gives the app time to warm up before liveness kicks in
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:           # restart the container when it stops being healthy
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:          # only send traffic to pods that are ready
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
